[workspace]
resolver = "2"
members = [
    "crates/lya",
    "crates/lya-base",
    "crates/lya-http",
    "crates/lya-llm",
    "crates/lya-tool",
    "crates/lya-prompt",
    "crates/lya-db",
    "crates/lya-session",
    "crates/lya-memory",
    "crates/lya-action",
    "crates/lya-config",
    "crates/lya-agent",
    "crates/lya-hub",
    "crates/lya-api",
    "crates/lya-media",
    "crates/lya-storage",
    "crates/lya-core",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-stream = "0.3"
axum = "0.8"
bytes = "1"
ego-tree = "0.11"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
futures-core = "0.3"
futures-util = "0.3"
lya-action = { path = "crates/lya-action" }
lya-agent = { path = "crates/lya-agent" }
lya-config = { path = "crates/lya-config" }
lya-api = { path = "crates/lya-api" }
lya-base = { path = "crates/lya-base" }
lya-hub = { path = "crates/lya-hub" }
lya-media = { path = "crates/lya-media" }
lya-storage = { path = "crates/lya-storage" }
lya-core = { path = "crates/lya-core" }
lya-db = { path = "crates/lya-db" }
lya-http = { path = "crates/lya-http" }
lya-llm = { path = "crates/lya-llm" }
lya-memory = { path = "crates/lya-memory" }
lya-prompt = { path = "crates/lya-prompt" }
lya-session = { path = "crates/lya-session" }
lya-tool = { path = "crates/lya-tool" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.27"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imagesize = "0.15"
regex = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
toml = "1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
rust-embed = { version = "8", features = ["compression"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = "0.3.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
