[workspace]
resolver = "2"
members = [
    "crates/lya-http",
    "crates/lya-llm",
    "crates/lya-tool",
    "crates/lya-prompt",
    "crates/lya-mode",
    "crates/lya-db",
    "crates/lya-session",
    "crates/lya-memory",
    "crates/lya-action",
    "crates/lya-config",
    "crates/lya-agent",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-stream = "0.3"
bytes = "1"
ego-tree = "0.11"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
futures-core = "0.3"
futures-util = "0.3"
lya-action = { path = "crates/lya-action" }
lya-agent = { path = "crates/lya-agent" }
lya-config = { path = "crates/lya-config" }
lya-db = { path = "crates/lya-db" }
lya-http = { path = "crates/lya-http" }
lya-llm = { path = "crates/lya-llm" }
lya-memory = { path = "crates/lya-memory" }
lya-mode = { path = "crates/lya-mode" }
lya-prompt = { path = "crates/lya-prompt" }
lya-session = { path = "crates/lya-session" }
lya-tool = { path = "crates/lya-tool" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
