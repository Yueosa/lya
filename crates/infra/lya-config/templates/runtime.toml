# lya 运行时默认值。改完重新加载即可生效，不必重启。
#
# 这一层只提供「默认」：会话自己设过的（工作模式、启用工具、人设）以会话为准，
# 它们存在数据库里，不在这个文件里。

[agent]
# 单次用户输入内，LLM 与工具/动作最多来回几轮。防死循环用，别设太大
max_tool_rounds = 32
# 同一条 assistant 消息里最多几个 tool_calls；超出则整组失败回灌给模型
max_parallel_tools = 3
# 连续多少次工具调用全失败就中止本轮（任一次成功即清零）。
# 管的是「原地打转」，和 max_tool_rounds 的「跑得太久」不是一回事。0 = 不启用
max_consecutive_tool_failures = 16
# 新会话的默认工作模式：ask 只读 / edit 可写 / agent 可执行
default_work_mode = "agent"
# 新会话的默认 API 栈：completions / responses
default_api_mode = "completions"
# 默认使用哪个模型，填 models.toml 里的 id
default_model = "deepseek-v4-flash"

[tools]
# 新会话默认启用哪些工具。
#
# 整行注释掉 = 启用全部工具（推荐）
# 给出数组 = 只启用列出的这些；空数组 [] = 一个都不启用
# enabled = ["file_read"]

[shell]
# 什么时候要你亲自过目一条 shell 命令：
#   unknown = 已知只读的命令（ls / cat / git status 之类）直接放行，其余都问一遍（默认）
#   risky   = 只有命中危险规则（rm -rf、sudo、dd 之类）才问，打断少但漏网多
#   always  = 每条都问
confirm = "unknown"

[memory]
# 长期记忆的索引会常驻在系统提示词里，这几个值限制它的体积。
# 超出上限时只保留最近更新的若干条，并告知模型还有多少条没列出。
max_index_entries = 100
max_index_chars = 4000
# 索引里每条摘要截断到多少字符
index_summary_chars = 120

# retain_* 决定「要不要自己留一份」：留了，源文件被移走或远程挂掉之后照样能看。
# 关掉只影响以后新出现的媒体，已经留下的一律照用，不会被删。
[media.image]
# 单张图片大小上限（字节）；local-image 与会话 media 端点共用
max_bytes = 33554432
# 本地图片是否在 sessions/{id}/img_cache/local 留一份（优先硬链接，不占额外空间）
retain_local = true
# 远程图片下载后是否留在 img_cache/web；关掉则每次经内存代理，不落盘
retain_web = true

[media.video]
# 单个视频大小上限（字节）
max_bytes = 536870912
retain_local = true
# 视频建议留着：播放器拖进度条会发 Range 请求，不落盘就得重新下载整个文件
retain_web = true

[media.audio]
# 单个音频大小上限（字节）
max_bytes = 134217728
retain_local = true
retain_web = true
