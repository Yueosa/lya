# 模型清单。前端选择与实际调用共用这一份。
#
# ⚠️ 本文件含 API 密钥，权限已设为 0600，不要提交到任何仓库。
#
# 固定字段：id / name / base_url / api_key / context_window / modes
# 透传参数只写在 [models.modes.*].params 里，按 API 栈分开。
#
# - context_window：lya 侧输入预算（token），不会发给 API。
# - modes.completions：Chat Completions（/chat/completions）
# - modes.responses：Responses API（/responses），Flash / Pro 可用原生 web_search
#
# capabilities 当前用到的值：
#   text        —— 文本生成（每个 mode 必填）
#   vision      —— 原生看图
#   web_search  —— Responses 原生联网（仅 modes.responses）

[[models]]
id = "deepseek-v4-flash"
name = "DeepSeek V4 Flash"
base_url = "https://api.deepseek.com"
api_key = "<在这里填入你的 DeepSeek API Key>"
context_window = 1048576

[models.modes.completions]
capabilities = ["text"]
params = {
  model = "deepseek-v4-flash",
  max_tokens = 8192,
  reasoning_effort = "high",
  thinking = { type = "enabled" },
}

[models.modes.responses]
capabilities = ["text", "web_search"]
params = {
  model = "deepseek-v4-flash",
  max_output_tokens = 8192,
  reasoning = { effort = "high" },
}

[[models]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
base_url = "https://api.deepseek.com"
api_key = "<在这里填入你的 DeepSeek API Key>"
context_window = 1048576

[models.modes.completions]
capabilities = ["text"]
params = {
  model = "deepseek-v4-pro",
  max_tokens = 8192,
  reasoning_effort = "high",
  thinking = { type = "enabled" },
}

[models.modes.responses]
capabilities = ["text", "web_search"]
params = {
  model = "deepseek-v4-pro",
  max_output_tokens = 8192,
  reasoning = { effort = "high" },
}

