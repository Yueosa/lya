futures-util = { workspace = true }
lya-action = { workspace = true }
lya-llm = { workspace = true }
lya-memory = { workspace = true }
lya-base = { workspace = true }
lya-prompt = { workspace = true }
lya-session = { workspace = true }
lya-token = { workspace = true }
lya-tool = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
lya-config = { workspace = true }
lya-db = { workspace = true, features = ["testing"] }
lya-http = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
