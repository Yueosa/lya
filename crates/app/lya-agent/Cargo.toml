[package]
name = "lya-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "lya 一轮对话的驱动器：上下文装配、循环、工具分发与 HITL"

[dependencies]
async-stream = { workspace = true }
chrono = { workspace = true }
