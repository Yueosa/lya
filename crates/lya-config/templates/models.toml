# 模型清单。前端选择与实际调用共用这一份。
#
# ⚠️ 本文件含 API 密钥，权限已设为 0600，不要提交到任何仓库。
#
# 固定字段会做校验：id / name / base_url / api_key / capabilities
# 其余字段**原样透传进请求体**，所以模型特有的参数直接写在这里就行，
# 不需要改代码（参考 https://api-docs.deepseek.com/zh-cn/ ）。
#
# capabilities 声明这个模型会干什么，缺省是 ["text"]。目前用到的值：
#   text   —— 文本生成
#   vision —— 原生看图
# 它让「让文本模型看图」这类错配在发请求之前就被挡下来。以后有视频、语音之类的
# 新能力，加个标签即可，不用改代码。

[[models]]
id = "deepseek-v4-flash"
name = "DeepSeek V4 Flash"
base_url = "https://api.deepseek.com"
api_key = "<在这里填入你的 DeepSeek API Key>"
capabilities = ["text"]
# 以下均为透传字段
model = "deepseek-v4-flash"
max_tokens = 8192
reasoning_effort = "high"
thinking = { type = "enabled" }

[[models]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
base_url = "https://api.deepseek.com"
api_key = "<在这里填入你的 DeepSeek API Key>"
capabilities = ["text"]
model = "deepseek-v4-pro"
max_tokens = 8192
reasoning_effort = "high"
thinking = { type = "enabled" }

# Gemini 有 OpenAI 兼容端点，加一条就能用，不需要改代码。
# 标上 vision 之后，会话切到它就能直接看图；也可以让文本模型通过工具借它一双眼睛。
